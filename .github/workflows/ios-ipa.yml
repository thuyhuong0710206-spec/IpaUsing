name: Build iOS IPA
on:
  workflow_dispatch:
    inputs:
      method:
        description: "unsigned | development | ad-hoc | app-store-connect"
        required: true
        default: unsigned

jobs:
  ipa:
    # macos-15 (arm64) thay cho macos-14: GitHub khai tu image macos-14 / macos-15-intel tu 2/11/2026.
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true # libiPhone-lib.a (196MB) / libil2cpp.a (65MB) duoc luu bang Git LFS

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build IPA
        env:
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
          BUNDLE_ID: ${{ vars.BUNDLE_ID }}
        run: bash ios-build/build-ipa.sh "${{ inputs.method }}"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ipa-${{ inputs.method }}
          path: ios-build/out/**/*.ipa
          if-no-files-found: warn
